<meta charset="utf-8">
<title>Nusaybah's Robo Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a full-screen picture-book scene. Robo stands on the left (bottom in portrait), the things to count fill the rest. One bright look on purpose. */
:root{
  --sky-top:#7cc8ff; --sky-mid:#b9a8ff; --sky-low:#ffc6e8;
  --pink:#ff5fa8; --sun:#ffd23f; --mint:#5fe3c9; --grape:#a678ff; --ink:#35246e; --paper:#ffffff;
  --display:'Fredoka','Baloo 2','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky-top);color:var(--ink);font-family:var(--display);overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:5px solid var(--sun);outline-offset:4px}
img{-webkit-user-drag:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}

/* ---------- world ---------- */
#sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 55%,var(--sky-low))}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;transform:scale(1.04);animation:breathe 24s ease-in-out infinite alternate}
.bgimg.on{opacity:1}
@keyframes breathe{to{transform:scale(1.12) translate(-1.5%,1%)}}
#shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(53,36,110,.28),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.15),transparent 30%);pointer-events:none}
#motes{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;bottom:-10vmin;width:var(--z);height:var(--z);border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff 0 12%,rgba(255,255,255,.25) 13% 60%,rgba(255,255,255,.55) 61%);
  animation:rise var(--s) linear infinite;animation-delay:var(--dl);opacity:.75}
@keyframes rise{to{transform:translate(var(--x),-120vh)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- HUD ---------- */
#hud{position:absolute;z-index:30;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:flex-start;gap:12px}
#gifts{display:flex;gap:6px;background:rgba(255,255,255,.75);padding:8px 12px;border-radius:999px;box-shadow:0 4px 0 rgba(53,36,110,.15)}
#gifts svg{width:34px;height:34px;transition:transform .4s cubic-bezier(.3,1.8,.5,1)}
#gifts svg.on{transform:scale(1.2) rotate(-12deg)}
#gifts svg .fill{fill:#fff;transition:fill .3s}
#gifts svg.on .fill{fill:var(--sun)}
#say{flex:1;display:flex;justify-content:center;min-width:0}
#sayInner{background:var(--paper);border-radius:28px;padding:10px 22px;font-size:clamp(20px,3.4vmin,34px);font-weight:600;line-height:1.15;
  box-shadow:0 6px 0 rgba(53,36,110,.18);max-width:min(640px,100%);text-align:center;text-wrap:balance;transform-origin:50% 0;opacity:0;transform:scale(.6)}
#sayInner.show{animation:sayIn .45s cubic-bezier(.3,1.8,.5,1) forwards}
#sayInner b{color:var(--pink)}
@keyframes sayIn{to{opacity:1;transform:scale(1)}}
.hudBtns{display:flex;gap:8px}
.round{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;box-shadow:0 4px 0 rgba(53,36,110,.18)}
.round svg{width:28px;height:28px}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(53,36,110,.18)}
.round.off{opacity:.5}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;display:grid;grid-template-columns:minmax(170px,31%) 1fr;
  padding:calc(env(safe-area-inset-top,0px) + 92px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));gap:8px;z-index:10}
#roboCell{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0}
#robo{position:relative;height:min(100%,64vh);aspect-ratio:490/620;max-width:100%;cursor:pointer}
#roboFloat{width:100%;height:100%;animation:float 3s ease-in-out infinite}
#roboFig{position:relative;width:100%;height:100%;transform-origin:50% 100%;filter:drop-shadow(0 16px 12px rgba(53,36,110,.3))}
#roboImg{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.fig{position:relative;height:100%;aspect-ratio:490/620}
.fig .rb{position:relative;z-index:1;width:100%;height:100%;display:block;object-fit:contain}
.wear{position:absolute;left:calc(var(--x) * 100%);top:calc(var(--y) * 100%);width:calc(var(--w) * 100%);height:auto;max-width:none;
  transform:translate(-50%,calc(var(--oy) * -100%)) rotate(var(--r));pointer-events:none;filter:drop-shadow(0 2px 2px rgba(53,36,110,.25))}
.wear.full{left:0;top:0;width:100%;height:100%;transform:none;filter:none}
.wear.pop{animation:wearPop .8s cubic-bezier(.3,1.8,.5,1)}
@keyframes wearPop{from{scale:2.4;opacity:0}}
@keyframes float{50%{transform:translateY(-12px)}}
#robo.jump #roboFig{animation:rjump .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes rjump{35%{transform:translateY(-22%) scale(1.04)}70%{transform:translateY(0) scale(1.08,.9)}}
#robo.dance #roboFig{animation:rdance .5s ease-in-out 5}
@keyframes rdance{25%{transform:rotate(-8deg) translateY(-6px)}75%{transform:rotate(8deg) translateY(-6px)}}
#robo.wiggle #roboFig{animation:rwiggle .8s}
@keyframes rwiggle{20%{transform:scale(1.08,.92)}40%{transform:scale(.94,1.06) rotate(-5deg)}60%{transform:scale(1.04,.96) rotate(5deg)}80%{transform:rotate(-2deg)}}
#robo.spin #roboFig{animation:rspin 1.4s ease-in-out}
@keyframes rspin{30%{transform:rotate(-20deg)}60%{transform:rotate(380deg)}100%{transform:rotate(360deg)}}
#robo.boing #roboFig{animation:rboing 1.2s ease-out}
@keyframes rboing{15%{transform:translateY(-18%)}30%{transform:translateY(0) scale(1.1,.88)}45%{transform:translateY(-10%)}60%{transform:translateY(0) scale(1.05,.94)}75%{transform:translateY(-4%)}100%{transform:none}}
#robo.sleep #roboFig{animation:rsleep 2.4s ease-in-out}
@keyframes rsleep{50%{transform:rotate(-6deg) translateY(4px) scale(.98)}}
#robo.sneeze #roboFig{animation:rsneeze 1.2s}
@keyframes rsneeze{0%,50%{transform:scale(1)}40%{transform:rotate(-6deg) scale(1.03)}60%{transform:rotate(8deg) translateX(-12px) scale(.95)}80%{transform:rotate(-3deg)}}
#robo.shy #roboFig{animation:rshy 1.6s ease-in-out}
@keyframes rshy{30%,70%{transform:rotate(-5deg) scale(.95)}}
#robo.peek #roboFig{animation:rpeek 1.6s}
@keyframes rpeek{30%,60%{transform:translateY(40%) scale(.9)}80%{transform:translateY(-8%) scale(1.05)}}
#robo.chomp #roboFig{animation:rchomp .35s}
@keyframes rchomp{50%{transform:scale(1.07,.92)}}
#robo.hearts #roboFig{animation:rheart 1s ease-in-out 2}
@keyframes rheart{50%{transform:scale(1.08)}}
#robo.bounce #roboFig{animation:rjump .7s cubic-bezier(.3,1.4,.5,1) 2}

#stage.scene{grid-template-columns:1fr}

#play{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vmin,26px);min-width:0;min-height:0}
@media (max-width:640px){
  #hud{flex-wrap:wrap}
  #say{order:3;flex-basis:100%}
  #stage{padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
}
@media (orientation:portrait){
  #stage{grid-template-columns:1fr;grid-template-rows:1fr minmax(150px,31%)}
  #roboCell{order:2}
  #robo{height:100%}
}
.field{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(6px,2vmin,18px);max-width:min(100%,820px)}
.obj{position:relative;width:var(--size);aspect-ratio:1;cursor:pointer;animation:popIn .55s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:var(--d)}
.obj .bob{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--bd)}
.obj img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 5px rgba(53,36,110,.28));transition:transform .25s cubic-bezier(.3,1.8,.5,1),filter .25s;pointer-events:none}
.obj.done img{transform:scale(1.12) rotate(-5deg);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 5px var(--sun))}
.obj.hl img{transform:scale(1.3);filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 6px var(--sun))}
.obj.hint .bob{animation:hint .6s ease-in-out 3}
.obj.gone{visibility:hidden}
.obj.dim{opacity:.35;pointer-events:none;filter:grayscale(.6)}
.obj.party .bob{animation:party .5s ease-in-out 3}
.obj.leaving,.obj.entering{animation:none}
.obj.leaving .bob{animation:none}
@keyframes party{50%{transform:translateY(-28%) rotate(10deg) scale(1.1)}}
.badge{position:absolute;top:-8%;right:-8%;width:44%;aspect-ratio:1;border-radius:50%;background:var(--pink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:clamp(18px,4vmin,34px);border:4px solid #fff;box-shadow:0 3px 0 rgba(53,36,110,.25);z-index:2;
  animation:popIn .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes popIn{from{transform:scale(0) rotate(-30deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-7%) rotate(3deg)}}
@keyframes hint{50%{transform:scale(1.25) rotate(-8deg)}}

.answers{display:flex;gap:clamp(10px,3vmin,28px);flex-wrap:wrap;justify-content:center}
.ans{width:clamp(92px,16vmin,150px);aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 0 rgba(53,36,110,.25),inset 0 -8px 0 rgba(0,0,0,.12);border:5px solid #fff;animation:popIn .5s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:var(--d)}
.ans .num{font-size:clamp(44px,9vmin,84px);font-weight:700;line-height:.95;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.ans .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:70%}
.ans .dots i{width:clamp(6px,1.2vmin,10px);aspect-ratio:1;border-radius:50%;background:#fff;opacity:.9}
.ans:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(53,36,110,.25)}
.ans.shake{animation:shake .5s}
.ans.right{animation:pulse .7s ease-in-out infinite}
.ans.fade{opacity:.3;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-12px) rotate(-6deg)}40%,80%{transform:translateX(12px) rotate(6deg)}}
@keyframes pulse{50%{transform:scale(1.14)}}

.sign{display:flex;align-items:center;gap:14px;background:#fff;border-radius:30px;padding:8px 22px 8px 14px;box-shadow:0 7px 0 rgba(53,36,110,.2);animation:popIn .5s cubic-bezier(.3,1.7,.5,1)}
.sign .num{font-size:clamp(54px,11vmin,100px);font-weight:700;color:var(--pink);line-height:1}
.sign .mini{display:flex;flex-wrap:wrap;gap:4px;max-width:200px}
.sign .mini img{width:34px;height:34px;object-fit:contain}
.nameTag{background:#fff;border-radius:999px;padding:6px 26px;font-size:clamp(30px,6vmin,58px);font-weight:700;color:var(--ink);box-shadow:0 6px 0 rgba(53,36,110,.2);
  animation:popIn .5s cubic-bezier(.3,1.7,.5,1)}
.nameTag b{color:var(--pink)}

#bigNum{position:absolute;z-index:35;inset:0;display:grid;place-items:center;pointer-events:none}
#bigNum span{font-size:min(46vmin,360px);font-weight:700;line-height:1;color:var(--c,var(--pink));opacity:0;
  -webkit-text-stroke:min(1.6vmin,12px) #fff;paint-order:stroke fill;text-shadow:0 1.4vmin 0 rgba(53,36,110,.22)}
#bigNum span.go{animation:bigPop 1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes bigPop{0%{opacity:0;transform:scale(.2) rotate(-25deg)}25%{opacity:1;transform:scale(1.1) rotate(6deg)}55%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.5) translateY(-10vmin)}}

/* friends pop in to cheer */
.friend{position:absolute;z-index:34;bottom:calc(env(safe-area-inset-bottom,0px) - 4px);width:clamp(110px,20vmin,190px);pointer-events:none;transform:translateY(120%);
  filter:drop-shadow(0 10px 8px rgba(53,36,110,.3))}
.friend.r{right:max(8px,env(safe-area-inset-right,0px))}
.friend.l{left:32%}
.friend.up{animation:friendUp 2.6s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes friendUp{0%{transform:translateY(120%)}18%{transform:translateY(-6%) rotate(-6deg)}30%{transform:translateY(0) rotate(4deg)}45%{transform:translateY(-14%) rotate(-4deg)}60%{transform:translateY(0)}82%{transform:translateY(0)}100%{transform:translateY(120%)}}

/* Robo's friend who plays alongside */
#buddy{position:fixed;left:0;top:0;width:clamp(90px,17vmin,170px);aspect-ratio:1;z-index:11;cursor:pointer;will-change:transform}
#buddy.land img{animation:bland .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bland{0%{transform:scale(1.3,.7)}100%{transform:none}}
#stage.scene #robo{visibility:visible}
#stage.scene #roboFloat{visibility:hidden}
#buddy .bfloat{width:100%;height:100%;animation:bfloat 2.4s ease-in-out infinite}
#buddy.pip .bfloat{animation:bhover 1.8s ease-in-out infinite}
#buddy.luna .bfloat{animation:bsway 3s ease-in-out infinite}
#buddy.bolt .bfloat{animation:bwag .7s ease-in-out infinite}
#buddy img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;filter:drop-shadow(0 10px 8px rgba(53,36,110,.3))}
@keyframes bfloat{50%{transform:translateY(-8%)}}
@keyframes bhover{0%,100%{transform:translateY(-12%) rotate(-5deg)}50%{transform:translateY(-26%) rotate(5deg)}}
@keyframes bsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4%)}}
@keyframes bwag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3%)}}
#buddy.enter img{animation:benter 1s cubic-bezier(.3,1.5,.5,1)}
@keyframes benter{from{transform:translateX(160%) rotate(40deg) scale(.4);opacity:0}}
#buddy.hop img{animation:bhop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bhop{40%{transform:translateY(-30%) scale(1.06,.94)}70%{transform:scale(1.08,.9)}}
#buddy.spin img{animation:bspin 1.1s ease-in-out}
@keyframes bspin{30%{transform:translateY(-35%) rotate(-20deg)}70%{transform:translateY(-35%) rotate(360deg)}100%{transform:rotate(360deg)}}
#buddy.talk img{animation:btalk .22s ease-in-out infinite alternate}
@keyframes btalk{to{transform:scale(1.06,.95) rotate(-2deg)}}

/* living scenes: drifting effects and things flying past */
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.flyby{position:fixed;left:0;top:0;width:clamp(64px,10vmin,120px);z-index:12;cursor:pointer;filter:drop-shadow(0 8px 6px rgba(53,36,110,.25))}

/* trip location chip */
#chip{display:flex;align-items:center;gap:6px;background:var(--pink);color:#fff;font-weight:700;font-size:clamp(15px,2.4vmin,22px);padding:8px 16px 8px 10px;border-radius:999px;border:3px solid #fff;box-shadow:0 4px 0 rgba(53,36,110,.18);animation:popIn .5s cubic-bezier(.3,1.7,.5,1);white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
#chip svg{width:1.3em;height:1.3em;flex:none}
@media (max-width:640px){#chip{max-width:60vw}}

/* new thing to wear */
#wearShow{position:absolute;inset:0;z-index:46;display:grid;place-items:center;background:rgba(53,36,110,.35)}
#wearShow .rays{position:absolute;width:min(110vmin,900px);aspect-ratio:1;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,226,90,.55) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#wearShow img{position:relative;width:min(52vmin,400px);height:min(52vmin,400px);object-fit:contain;filter:drop-shadow(0 14px 14px rgba(30,20,70,.35));animation:popIn .7s cubic-bezier(.3,1.7,.5,1)}
#wearShow .ribbon2{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);background:var(--pink);color:#fff;font-weight:700;font-size:clamp(24px,5vmin,48px);padding:6px 28px 8px;border-radius:999px;border:4px solid #fff;box-shadow:0 6px 0 rgba(30,20,70,.25);animation:popIn .6s .3s cubic-bezier(.3,1.7,.5,1) backwards}

/* flight to a trip */
#flight{position:absolute;inset:0;z-index:47;overflow:hidden;background:linear-gradient(180deg,#5fb6ff,#a9dcff 60%,#e3f4ff)}
#flight .cl{position:absolute;left:100%;height:calc(var(--h) * 1px);width:calc(var(--h) * 2.4px);background:#fff;border-radius:999px;opacity:.9;animation:fly var(--s) linear infinite;animation-delay:var(--d);top:var(--t)}
#flight .cl::before{content:"";position:absolute;width:55%;height:120%;left:18%;bottom:30%;background:#fff;border-radius:50%}
@keyframes fly{to{transform:translateX(calc(-100vw - 400px))}}

#flight .plane .pimg{width:100%;display:block;transform:scaleX(-1)}
#flight .plane .fig{position:absolute;height:52%;left:30%;bottom:62%;}
#flight .bob{animation:bobPlane 1s ease-in-out infinite}
@keyframes bobPlane{50%{transform:translateY(-14px) rotate(-3deg)}}
@keyframes planeGo{from{transform:translateX(-70vmin)}to{transform:translateX(calc(100vw + 10vmin))}}
#flight .dest{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10vh);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);font-weight:700;font-size:clamp(26px,6vmin,58px);padding:8px 30px 10px;border-radius:999px;box-shadow:0 8px 0 rgba(30,20,70,.2);white-space:nowrap;animation:popIn .6s .6s cubic-bezier(.3,1.7,.5,1) backwards}
#flight .dest svg{width:1em;height:1em}

#flight.land,#flight.animal{background:linear-gradient(180deg,#7cc8ff,#bfe6ff 55%,#e9f7ff)}
#flight.sea{background:linear-gradient(180deg,#7cc8ff,#c7ecff 50%,#e9f7ff)}
#flight .hills{position:absolute;left:0;right:0;background-repeat:repeat-x;animation:scroll var(--sp) linear infinite}
#flight .h1{bottom:18%;height:34%;background-image:radial-gradient(ellipse 50% 100% at 50% 100%,#9be7a8 98%,transparent 100%);background-size:46vmin 100%;--sp:9s}
#flight .h2{bottom:14%;height:24%;background-image:radial-gradient(ellipse 50% 100% at 50% 100%,#6fd68a 98%,transparent 100%);background-size:34vmin 100%;--sp:5s;background-position-x:17vmin}
@keyframes scroll{to{background-position-x:-200vmin}}
#flight .road{position:absolute;left:0;right:0;bottom:0;height:16%;background:#7d7a8c;box-shadow:inset 0 8px 0 #66637a}
#flight .road::after{content:"";position:absolute;left:0;right:0;top:46%;height:8%;background:repeating-linear-gradient(90deg,#fff 0 6vmin,transparent 6vmin 12vmin);animation:roadline .6s linear infinite}
@keyframes roadline{to{background-position-x:-12vmin}}
#flight .grass{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#5cc77a,#46b066)}
#flight .waves{position:absolute;left:0;right:0;background-repeat:repeat-x;animation:scroll var(--sp) linear infinite}
#flight .w1{bottom:0;height:34%;background:radial-gradient(circle at 50% 0,transparent 47%,#3fa9e8 49%) 0 0/16vmin 100%,linear-gradient(#3fa9e8,#3fa9e8) 0 3vmin/100% 100% no-repeat;--sp:7s}
#flight .w2{bottom:0;height:20%;background:radial-gradient(circle at 50% 0,transparent 47%,#2b8fd1 49%) 0 0/11vmin 100%,linear-gradient(#2b8fd1,#2b8fd1) 0 2.4vmin/100% 100% no-repeat;--sp:4s;z-index:3}
#flight .prop{position:absolute;bottom:14%;height:var(--h);left:100%;animation:passby var(--s) linear infinite;animation-delay:var(--d);filter:drop-shadow(0 6px 4px rgba(0,0,0,.15))}
@keyframes passby{to{transform:translateX(calc(-100vw - 300px))}}
#flight .veh{position:absolute;left:0;width:min(50vmin,440px);z-index:2;animation:vehGo 6.5s cubic-bezier(.35,0,.65,1) forwards}
#flight .veh.air{top:24%;width:min(60vmin,520px)}
#flight .veh.land,#flight .veh.animal{bottom:9%}
#flight .veh.sea{bottom:14%}
@keyframes vehGo{from{transform:translateX(-60vmin)}to{transform:translateX(calc(100vw + 8vmin))}}
#flight .veh .bob{position:relative}
#flight .veh.air .bob{animation:bobPlane 1s ease-in-out infinite}
#flight .veh.land .bob{animation:bump .35s ease-in-out infinite}
#flight .veh.animal .bob{animation:gallop .55s ease-in-out infinite}
#flight .veh.sea .bob{animation:rock 1.6s ease-in-out infinite}
@keyframes bump{50%{transform:translateY(-3%)}}
@keyframes gallop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10%) rotate(-4deg)}60%{transform:translateY(-3%) rotate(3deg)}}
@keyframes rock{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-5%)}}
#flight .veh .pimg{position:relative;z-index:1;width:100%;display:block}
#flight .veh .pimg.flip{transform:scaleX(-1)}

<script>
(() => {

  for (const p of ambParts) {
    p.ph += .02; p.rot += p.vr;
    if (p.k === 'leaves' || p.k === 'petals') p.x += p.vx + Math.sin(p.ph) * .8;
    else if (p.k === 'snow') p.x += Math.sin(p.ph) * .5;
    else if (p.k === 'bubbles') p.x += Math.sin(p.ph * 1.5) * .5;
    else if (p.k === 'fireflies' || p.k === 'motes') { p.vx += rnd(-.03, .03); p.vy += rnd(-.03, .03); p.vx *= .98; p.vy *= .98; p.x += p.vx; }
    if (p.k !== 'fireflies' && p.k !== 'motes') p.x += p.vx;
    p.y += p.vy;
    if (p.k === 'sparkle') p.life -= .006;
    ax.save(); ax.translate(p.x, p.y);
    if (p.k === 'leaves' || p.k === 'petals') { ax.rotate(p.rot + Math.sin(p.ph) * .6); ax.fillStyle = p.c; ax.globalAlpha = .85; ax.beginPath(); ax.ellipse(0, 0, p.r, p.r * .5, 0, 0, 7); ax.fill(); }
    else if (p.k === 'snow') { ax.fillStyle = '#fff'; ax.globalAlpha = .9; ax.beginPath(); ax.arc(0, 0, p.r, 0, 7); ax.fill(); }
    else if (p.k === 'rain') { ax.strokeStyle = 'rgba(220,240,255,.7)'; ax.lineWidth = 2; ax.beginPath(); ax.moveTo(0, 0); ax.lineTo(-2, p.r); ax.stroke(); }
    else if (p.k === 'bubbles') { ax.strokeStyle = 'rgba(255,255,255,.75)'; ax.lineWidth = 2; ax.beginPath(); ax.arc(0, 0, p.r, 0, 7); ax.stroke(); ax.fillStyle = 'rgba(255,255,255,.6)'; ax.beginPath(); ax.arc(-p.r * .35, -p.r * .35, p.r * .25, 0, 7); ax.fill(); }
    else if (p.k === 'stars' || p.k === 'sparkle') { const a = p.k === 'stars' ? .35 + .65 * Math.abs(Math.sin(ts * 1.5 + p.ph * 20)) : Math.sin(p.life * Math.PI); ax.globalAlpha = a; ax.fillStyle = p.c; ax.rotate(p.rot); ax.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? p.r * .25 : p.r; const an = i * Math.PI / 4; ax.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ax.fill(); }
    else { const a = .4 + .6 * Math.abs(Math.sin(ts * 2 + p.ph * 10)); const gr = ax.createRadialGradient(0, 0, 0, 0, 0, p.r * 4); gr.addColorStop(0, p.c); gr.addColorStop(1, 'rgba(255,255,200,0)'); ax.globalAlpha = a * (p.k === 'motes' ? .6 : 1); ax.fillStyle = gr; ax.beginPath(); ax.arc(0, 0, p.r * 4, 0, 7); ax.fill(); }
    ax.restore();
  }
  ambRaf = requestAnimationFrame(ambTick);
}
// things fly or swim past now and then; tap one and Robo says its name
async function flyby(id) {
  const im = await loadImg(objSrc(id)); if (!im) return;
  const el = document.createElement('img'); el.className = 'flyby'; el.src = im.src; el.alt = DATA.objects[id].s;
  document.getElementById('app').appendChild(el);
  const W = innerWidth, H = innerHeight, y0 = rnd(.14, .42) * H, dir = Math.random() < .5 ? 1 : -1, waves = rnd(2, 4), amp = rnd(20, 50);
  const kf = []; for (let i = 0; i <= 12; i++) { const t = i / 12; kf.push({ transform: `translate(${dir > 0 ? -160 + t * (W + 320) : W + 160 - t * (W + 320)}px,${y0 + Math.sin(t * Math.PI * waves) * amp}px) rotate(${Math.cos(t * Math.PI * waves) * 8}deg)` }); }
  const a = el.animate(kf, { duration: rnd(8000, 12000), easing: 'linear' });
  el.animate([{ scale: '1 1' }, { scale: '1 .86' }], { duration: rnd(250, 400), iterations: Infinity, direction: 'alternate' });
  a.finished.then(() => el.remove()).catch(() => el.remove());
  el.addEventListener('pointerdown', e => {
    e.stopPropagation(); burst(e.clientX, e.clientY, 22, { shapes: ['star', 'heart'] }); sfx.sparkle();
    el.animate([{ rotate: '0deg' }, { rotate: '360deg' }], { duration: 700, composite: 'add' });
    loadSprite('o_' + id).then(() => { if (!voice) say('o_' + id + ':name'); });
  });
}
setInterval(() => { if (!$('#stage').hidden && flyList.length && !document.hidden && $('#postcard').hidden && Math.random() < .7) flyby(pick(flyList)); }, 8000);

// After the postcard, play inside the place: count the things that live there
async function adventureGift(a, isNew, g) {
  const place = a.cat === 'place';
  await g(Promise.all([loadSprite('trip'), loadSprite('adv')]));
  if (place && DATA.flights.includes(a.id)) { robo.pose('cheer', 2000); await g(say('core:trip')); await g(journey(a, g)); }
  await g(showPostcard(a, isNew, g));
  const obj = DATA.advCount[a.id];
  if (obj && DATA.objects[obj]) {
    setMood('trip'); await setBgSrc('img/adv/' + a.id + '.webp');
    $('#stage').classList.add('scene');
    try { await g(roundTap(pickN(), g, { obj, intro: 'trip:cnt_' + a.id, keepBg: true })); }
    finally { $('#stage').classList.remove('scene'); }
  }
  if (place && DATA.trips.includes(a.id)) { S.trip = { id: a.id, left: 3 }; save(); updateChip(); }
}

function nextWear() {
  const owned = new Set(S.owned), c = [];
  for (const items of Object.values(DATA.wardrobe)) { const nx = items.find(it => !owned.has(it.id)); if (nx) c.push(nx); }
  return c.length ? pick(c) : null;
}
async function wearGift(it, g) {
  await g(loadSprite('wear'));
  const W = $('#wearShow');
  W.innerHTML = `<div class="rays"></div><img src="img/wear/${it.id}.webp" alt="${it.cap}"><div class="ribbon2">${it.cap}</div>`;
  W.hidden = false; sfx.sparkle(); confetti(); robo.pose('wow', 3000);
  await g(say('core:wearnew'));
  buddy.hop(); await g(buddy.line('look'));
  await g(say('wear:' + it.id));
  // the new thing flies onto Robo
  const im = W.querySelector('img'), from = im.getBoundingClientRect(), fr = $('#roboFig').getBoundingClientRect();
  const nat = im.naturalHeight / Math.max(1, im.naturalWidth), tw = fr.width * it.w, th = tw * nat;
  const fw = Math.min(from.width, from.height / nat);
  const tx = fr.left + fr.width * it.x, ty = fr.top + fr.height * it.y + (0.5 - it.oy) * th;
  W.querySelector('.rays').remove(); W.querySelector('.ribbon2').remove(); W.style.background = 'transparent';
  sfx.whoosh();
  await g(im.animate([{ transform: 'none' }, { transform: `translate(${tx - (from.left + from.width / 2)}px,${ty - (from.top + from.height / 2)}px) rotate(${it.r}deg) scale(${tw / fw})` }],
    { duration: 850, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).finished);
  W.hidden = true; W.innerHTML = ''; W.style.background = '';
  if (!S.owned.includes(it.id)) S.owned.push(it.id);
  S.wear[it.slot] = it.id; save(); dressRobo(it.id);
  const c = center(RI); burst(c.x, c.y - 40, 40, { speed: 12 }); sfx.tada(); robo.pose('love', 2500); robo.anim('jump', 950);
  await g(say('core:wearit'));
}
async function maybeGift(g) {
  if (S.progress < 2) return;
  S.progress = 0; drawGifts(); save();
  clearPlay();
  const wearNext = nextWear(), order = advOrder();
  const advFresh = order.some(i => !S.got.includes(i));
  const doWear = !!wearNext && (S.owned.length === 0 || !advFresh || Math.random() < .5);
  const a = doWear ? null : DATA.adventures.find(x => x.id === order[S.advNext % order.length]);
  if (a) { loadImg('img/adv/' + a.id + '.webp'); loadSprite('adv'); loadSprite('trip'); if (DATA.advCount[a.id]) { loadSprite('o_' + DATA.advCount[a.id]); loadImg(objSrc(DATA.advCount[a.id])); } }
  else { loadImg('img/wear/' + wearNext.id + '.webp'); loadSprite('wear'); }
  const P = $('#present'); P.className = ''; P.innerHTML = `<button aria-label="Open the gift">${giftSVG()}</button>`; P.hidden = false;
  sfx.whoosh(); robo.pose('wow', 2500);
  await g(say('core:present'));
  await g(new Promise(res => {
    const btn = P.querySelector('button'); let n = 0;
    const t = setTimeout(go, 10000), nag = setInterval(() => { if (n++ < 2 && !voice) say(n === 1 ? 'core:nm_gift' : 'core:tapgift'); }, 4000);
    function go() { clearTimeout(t); clearInterval(nag); btn.removeEventListener('click', go); res(); }
    btn.addEventListener('click', go);
  }));
  P.classList.add('open'); sfx.sparkle(); const c = center(P.querySelector('button')); burst(c.x, c.y - 30, 70, { speed: 15, size: 16 });
  await g(wait(800)); P.hidden = true;
  if (doWear) await wearGift(wearNext, g);
  else {
    const isNew = !S.got.includes(a.id);
    if (isNew) S.got.push(a.id); S.advNext++; save();
    await adventureGift(a, isNew, g);
  }
  robo.pose('love', 2000);
}

const MODES = ['tap', 'tap', 'tap', 'howmany', 'tap', 'tap', 'feed', 'tap', 'tap', 'howmany', 'tap', 'feed'];
async function gameLoop() {
  const id = ++runId, g = guard(id);
  try {
    drawGifts(); updateChip(); dressRobo(); if (DATA.friends.length) buddy.set(DATA.friends[Math.floor(S.round / 3) % DATA.friends.length]);
    setTimeout(() => buddy.show(), 700);
    if (!(S.trip && S.trip.left > 0)) setBg(pick(['park', 'garden', 'rainbow', 'playground'])); else roundBg();
    robo.pose('wave', 3500);
    await g(say(S.round > 0 ? 'core:welcome' : 'core:hello'));
    await g(say('core:nm_ready'));
    while (true) {
      const mode = MODES[S.round % MODES.length], n = pickN();
      if (DATA.friends.length) buddy.set(DATA.friends[Math.floor(S.round / 3) % DATA.friends.length]);
      if (mode === 'tap') await g(roundTap(n, g));
      else if (mode === 'howmany') await g(roundHowMany(n, g));
      else await g(roundFeed(n, g));
      S.round++; S.progress++;
      if (S.trip && S.trip.left > 0) { S.trip.left--; if (!S.trip.left) { S.trip = null; updateChip(); } }
      drawGifts(); save();
      robo.setBase('base');
      await g(wait(400));
      await maybeGift(g);
      clearPlay(); await g(wait(300));
    }
  } catch (e) { if (e !== CANCEL) console.error(e); }
}

/* ================= album: trips and clothes ================= */
const SLOT_NAMES = { head: 'Hats and hair', eyes: 'Glasses', neck: 'Neck', dress: 'Dresses', back: 'Wings', feet: 'Shoes' };
function openAlbum(tab = 'trips') {
  const A = $('#album'), got = new Set(S.got), owned = new Set(S.owned), list = DATA.adventures;
  const nWear = Object.values(DATA.wardrobe).reduce((t, v) => t + v.length, 0);
  let body = '';
  if (tab === 'trips') {
    body = `<div class="grid">${list.filter(a => got.has(a.id)).map(a => `<button class="tile" data-id="${a.id}"><img loading="lazy" src="img/adv/${a.id}.webp" alt=""><span>${a.cap}</span></button>`).join('')}
      ${list.filter(a => !got.has(a.id)).slice(0, 12).map(() => `<div class="tile locked"><svg viewBox="0 0 200 200">${giftSVG().replace(/<\/?svg[^>]*>/g, '')}</svg></div>`).join('')}</div>`;
  } else {
    body = Object.entries(DATA.wardrobe).filter(([, v]) => v.length).map(([slot, items]) => `<div class="slotRow"><h3>${SLOT_NAMES[slot] || slot}</h3><div class="wgrid">
      ${items.map(it => owned.has(it.id) ? `<button class="wtile${S.wear[slot] === it.id ? ' on' : ''}" data-w="${it.id}"><img src="img/wear/${it.id}.webp" alt=""><span>${it.cap}</span></button>`
        : `<div class="wtile locked"><svg viewBox="0 0 200 200">${giftSVG().replace(/<\/?svg[^>]*>/g, '')}</svg></div>`).join('')}</div></div>`).join('');
  }
  A.innerHTML = `<header><h2>Robo's Treasures<small>${got.size} of ${list.length} trips · ${owned.size} of ${nWear} clothes</small></h2>
    <button class="round" id="albumClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#35246e" stroke-width="3" stroke-linecap="round"/></svg></button></header>
    <div class="tabs"><button class="tab${tab === 'trips' ? ' on' : ''}" data-tab="trips">Trips and fun</button><button class="tab${tab === 'clothes' ? ' on' : ''}" data-tab="clothes">Robo's clothes</button></div>${body}`;
  A.hidden = false;
  if (ctx) { loadSprite('adv'); loadSprite('wear'); }
  $('#albumClose').addEventListener('click', e => { e.stopPropagation(); stopVoice(); A.hidden = true; });
  A.querySelectorAll('.tab').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openAlbum(b.dataset.tab); if (ctx && b.dataset.tab === 'clothes') say('core:clothes'); }));
  A.querySelectorAll('.tile[data-id]').forEach(t => t.addEventListener('click', e => { e.stopPropagation(); initAudio(); showPostcard(list.find(a => a.id === t.dataset.id), false, null); }));
  A.querySelectorAll('.wtile[data-w]').forEach(t => t.addEventListener('click', e => {
    e.stopPropagation(); initAudio(); const it = WEAR[t.dataset.w];
    S.wear[it.slot] = it.id; save(); dressRobo(it.id); dressCast(); sfx.sparkle(); burst(e.clientX, e.clientY, 16);
    loadSprite('wear').then(() => say('wear:' + it.id)); openAlbum('clothes');
  }));
}

/* ================= start / home ================= */
(function title() {
  let h = ''; [...'Robot Counting!'].forEach((ch, i) => h += ch === ' ' ? ' ' : `<span class="ch" style="--c:${COLORS[i % COLORS.length]};--d:${(i * .07).toFixed(2)}s">${ch}</span>`);
  $('#t2').innerHTML = h;
})();
async function boot() {
  try {
    const [d, v] = await Promise.all([fetch('game.json').then(r => r.json()), fetch('voice/voice.json').then(r => r.json())]);
    DATA = d; VOICE = v;
  } catch (e) { $('#loadMsg').textContent = 'Could not load the game files.'; return; }
  for (const [slot, items] of Object.entries(DATA.wardrobe || {})) items.forEach(it => { WEAR[it.id] = Object.assign({ slot }, it); });
  dressCast(); dressRobo();
  setBg('rainbow');
  DATA.poses.forEach(p => loadImg('img/robo/' + p + '.webp'));
  robo.render();
}
boot();
let loaded = false;
$('#playBtn').addEventListener('click', async e => {
  e.stopPropagation(); if (!DATA) return;
  initAudio(); sfx.sparkle(); const c = center($('#playBtn')); burst(c.x, c.y, 40, { speed: 12 });
  if (!loaded) {
    $('#loadMsg').textContent = 'Robo is waking up…';
    await Promise.all([loadSprite('core'), ...DATA.poses.map(p => loadImg('img/robo/' + p + '.webp'))]);
    loaded = true;
  }
  $('#loadMsg').textContent = 'Tap to play!';
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (err) {}
  $('#start').classList.add('leave');
  setTimeout(() => { $('#start').hidden = true; $('#start').classList.remove('leave'); }, 600);
  $('#hud').hidden = false; $('#stage').hidden = false;
  startMusic(); gameLoop();
});
$('#albumBtn2').addEventListener('click', e => { e.stopPropagation(); if (DATA) { initAudio(); openAlbum(); } });
$('#albumBtn').addEventListener('click', e => { e.stopPropagation(); openAlbum(); });
$('#homeBtn').addEventListener('click', e => {
  e.stopPropagation(); runId++; stopVoice(); clearPlay(); robo.setBase('base');
  $('#present').hidden = true; $('#postcard').hidden = true; $('#sayInner').classList.remove('show');
  buddy.hide(); $('#wearShow').hidden = true; $('#flight').hidden = true; $('#flight').innerHTML = ''; $('#stage').classList.remove('scene');
  $('#hud').hidden = true; $('#stage').hidden = true; $('#start').hidden = false; setBg('rainbow'); dressCast();
});
$('#musicBtn').addEventListener('click', e => {
  e.stopPropagation(); musicOn = !musicOn; $('#musicBtn').classList.toggle('off', !musicOn);
  if (musicGain) musicGain.gain.setTargetAtTime(musicOn ? .045 : 0, ctx.currentTime, .2);
});
$('#app').addEventListener('pointerdown', e => {
  if (!ctx) return; if (ctx.state !== 'running') ctx.resume();
  burst(e.clientX, e.clientY, 8, { speed: 5, size: 9, shapes: ['star'] }); sfx.twinkle();
});
document.addEventListener('visibilitychange', () => { if (!ctx) return; document.hidden ? ctx.suspend() : ctx.resume(); });
})();
</script>
